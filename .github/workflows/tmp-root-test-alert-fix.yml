name: temporary root test alert fix

on:
  push:
    branches:
      - fix/phase-5c-test-alert-root-view

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch root saved-search view
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text()
          old_import = 'import SavedSearches from "@/components/SavedSearches";'
          new_import = old_import + '\nimport TestAlertPanel from "@/components/TestAlertPanel";'
          if 'import TestAlertPanel from "@/components/TestAlertPanel";' not in s:
              if old_import not in s:
                  raise SystemExit('SavedSearches import not found')
              s = s.replace(old_import, new_import, 1)
          old_view = '{view==="saved-searches"&&<SavedSearches/>}'
          new_view = '{view==="saved-searches"&&<><TestAlertPanel/><SavedSearches/></>}'
          if new_view not in s:
              if old_view not in s:
                  raise SystemExit('saved-searches view render not found')
              s = s.replace(old_view, new_view, 1)
          p.write_text(s)
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/tmp-root-test-alert-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/page.tsx .github/workflows/tmp-root-test-alert-fix.yml
          git commit -m "fix: show test alert panel in saved-search view"
          git push origin HEAD
