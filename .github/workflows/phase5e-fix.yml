name: Phase 5E persistence fix

on:
  push:
    branches: [fix/phase-5e-saved-search-result-persistence]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace session storage with local storage
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/SavedSearches.tsx')
          text = path.read_text()
          old = 'function readStoredRuns():Record<string,StoredRun>{try{const raw=sessionStorage.getItem(RESULTS_KEY);return raw?JSON.parse(raw):{}}catch{return {}}}\nfunction writeStoredRuns(value:Record<string,StoredRun>){try{sessionStorage.setItem(RESULTS_KEY,JSON.stringify(value))}catch{}}'
          new = 'function readStoredRuns():Record<string,StoredRun>{try{const raw=localStorage.getItem(RESULTS_KEY);if(raw)return JSON.parse(raw);const legacy=sessionStorage.getItem(RESULTS_KEY);if(legacy){localStorage.setItem(RESULTS_KEY,legacy);sessionStorage.removeItem(RESULTS_KEY);return JSON.parse(legacy)}return {}}catch{return {}}}\nfunction writeStoredRuns(value:Record<string,StoredRun>){try{localStorage.setItem(RESULTS_KEY,JSON.stringify(value))}catch{}}'
          if old not in text:
              raise SystemExit('Expected SavedSearches storage implementation was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/phase5e-fix.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SavedSearches.tsx .github/workflows/phase5e-fix.yml
          git commit -m "fix: persist saved search results across sessions"
          git push
